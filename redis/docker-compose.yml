services:
  redis:
    image: redis:8.2.0
    container_name: redis
    restart: always
    command: redis-server --requirepass mylocalpass --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shared-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - shared-net
    depends_on:
      - redis

volumes:
  redis_data:
  redisinsight_data:

networks:
  shared-net:
    external: true
    name: shared-net
    driver: bridge
